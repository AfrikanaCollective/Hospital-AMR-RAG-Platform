[project]
name = "hospital-rag-platform"
version = "0.1.0"
description = "RAG platform for hospital use — grounded, cited answers with multi-agent orchestration and HITL evaluation."
requires-python = ">=3.11"

# NOTE: versions below are indicative for the Phase 1 skeleton. Pin exactly
# (and add a lockfile) when real logic lands in Phase 2+ (PRD-NFR-3).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "cryptography>=43.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
    "faker>=30.0",           # synthetic data generator only
    "krippendorff>=0.8",     # IRR metric (ARCH-021)
]
# Optional local model backends (ARCH-004 / ARCH-012). Not needed with
# EMBEDDING_BACKEND=stub / RERANKER_BACKEND=stub.
local-models = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
