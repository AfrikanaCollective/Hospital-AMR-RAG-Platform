<div style="background: var(--surface-1); border-radius: 12px; padding: 1rem; max-width: 380px;">

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
    <span style="font-size:13px; color:var(--text-secondary);">Domain 3 of 11</span>
    <span style="font-size:13px; color:var(--text-secondary);">groundedness</span>
  </div>
  <div style="height:4px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:16px;">
    <div style="width:27%; height:100%; background:var(--fill-accent);"></div>
  </div>

  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;">
    <div style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
      <span style="font-size:15px; font-weight:500;">Groundedness</span>
      <i class="ti ti-chevron-down" style="font-size:18px; color:var(--text-secondary);" aria-hidden="true"></i>
    </div>
    <p style="font-size:13px; color:var(--text-secondary); margin:6px 0 0; line-height:1.5;">Does every claim trace to a verbatim, correctly cited source passage.</p>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:14px;">
    <span style="font-size:13px; color:var(--text-secondary);"><i class="ti ti-file-text" style="font-size:15px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>View answer and citations</span>
    <i class="ti ti-chevron-right" style="font-size:16px; color:var(--text-muted);" aria-hidden="true"></i>
  </div>

  <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:8px;">
    <button style="height:52px; padding:0; font-size:15px; font-weight:500;">1</button>
    <button style="height:52px; padding:0; font-size:15px; font-weight:500;">2</button>
    <button style="height:52px; padding:0; font-size:15px; font-weight:500; background:var(--fill-accent); color:var(--on-accent); border-color:var(--fill-accent);">3</button>
    <button style="height:52px; padding:0; font-size:15px; font-weight:500;">4</button>
    <button style="height:52px; padding:0; font-size:15px; font-weight:500;">5</button>
  </div>
  <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
    <span style="font-size:12px; color:var(--text-muted);">Major gaps</span>
    <span style="font-size:12px; color:var(--text-muted);">Fully grounded</span>
  </div>

  <div style="display:flex; gap:8px; border-top:0.5px solid var(--border); padding-top:12px;">
    <button style="flex:1;"><i class="ti ti-arrow-left" style="font-size:15px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Back</button>
    <button style="flex:1; background:var(--fill-primary); color:var(--on-primary); border-color:var(--fill-primary);">Next<i class="ti ti-arrow-right" style="font-size:15px; vertical-align:-2px; margin-left:4px;" aria-hidden="true"></i></button>
  </div>

</div>
