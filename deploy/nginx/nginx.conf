# Reverse proxy (ARCH-036). TLS termination + routing. Dev uses a self-signed
# cert in /etc/nginx/tls (see deploy/tls/README.md). Prod certs are external.
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  # Plain HTTP: healthcheck + redirect to HTTPS.
  server {
    listen 80;
    location = /healthz { return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/dev.crt;
    ssl_certificate_key /etc/nginx/tls/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Never removable: also enforced server-side (ARCH-037), this is defense in depth.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 200 "ok\n"; }

    location /api/ {
      proxy_pass http://api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://frontend:80/;
      proxy_set_header Host $host;
    }
  }
}
