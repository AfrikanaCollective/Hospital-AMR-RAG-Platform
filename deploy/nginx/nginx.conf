# Reverse proxy (ARCH-036). TLS termination + routing. Dev uses a self-signed
# cert in /etc/nginx/tls (see deploy/tls/README.md). Prod certs are external.
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  # Real guideline PDFs routinely run tens of MB (DEVIATIONS.md #106) — nginx's
  # 1MB default silently 413'd every real-sized `POST /api/ingest/documents`
  # upload, found ingesting a real ~15MB guideline PDF through this proxy.
  client_max_body_size 100m;

  # Plain HTTP: healthcheck + redirect to HTTPS.
  server {
    listen 80;
    location = /healthz { return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/dev.crt;
    ssl_certificate_key /etc/nginx/tls/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Never removable: also enforced server-side (ARCH-037), this is defense in depth.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 200 "ok\n"; }

    location /api/ {
      # No path on proxy_pass (no trailing slash after the host:port) is
      # deliberate: nginx then forwards the ORIGINAL request URI unchanged,
      # including the /api/ prefix. The FastAPI app itself mounts every
      # route under /api (app.main: `api_base_path`), so a proxy_pass that
      # strips the prefix (`http://api:8000/`, trailing slash) sends the
      # backend a path it never registered a route for -> every request
      # through the proxy 404s despite the same path working when called
      # directly against the api container. Caught by an end-to-end
      # docker-compose verification pass, not by any unit/integration test
      # (DEVIATIONS.md #95) — nothing else in this repo exercises requests
      # through this proxy.
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://frontend:80/;
      proxy_set_header Host $host;
    }
  }
}
